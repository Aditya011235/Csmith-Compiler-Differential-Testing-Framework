[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "csmith-compiler-difftest"
version = "0.2.0"
description = "A reproducible differential-testing harness for C compilers using Csmith"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Project Author"}]
keywords = ["compiler", "fuzzing", "csmith", "differential-testing", "testing"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: POSIX :: Linux",
  "Topic :: Software Development :: Testing",
]
dependencies = []

[project.scripts]
csmith-difftest = "difftest.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
